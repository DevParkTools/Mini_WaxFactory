function makeWaxTex(level){
const c=document.createElement('canvas');c.width=c.height=256;
const g=c.getContext('2d');
g.fillStyle='#fff';g.fillRect(0,0,256,256);
const rng=mulberry32(77);
for(let i=0;i<700;i++){const v=225+((rng()*26)|0);g.fillStyle='rgba('+(v-14)+','+(v-20)+','+(v-30)+','+(0.04+rng()*0.06).toFixed(3)+')';g.beginPath();g.arc(rng()*256,rng()*256,rng()*16+2,0,TAU);g.fill()}
if(level>0){
const cr=mulberry32(900+level);
const branch=(x,y,a,len,w,d)=>{
g.lineWidth=w;g.beginPath();g.moveTo(x,y);
let cx=x,cy=y;const seg=Math.max(2,(len/10)|0);
for(let i=0;i<seg;i++){a+=(cr()-0.5)*0.9;cx+=Math.cos(a)*len/seg;cy+=Math.sin(a)*len/seg;g.lineTo(cx,cy);
if(d>0&&cr()<0.28)branch(cx,cy,a+(cr()<0.5?1:-1)*(0.5+cr()*0.7),len*0.5,w*0.7,d-1)}
g.stroke()};
const n=level===1?5:11;
for(let pass=0;pass<2;pass++){
g.strokeStyle=pass===0?'rgba(255,255,255,0.7)':'rgba(70,32,24,0.92)';
const cr2=mulberry32(900+level);
for(let i=0;i<n;i++){const a=(i/n)*TAU+cr2()*0.6;const ox=pass===0?1.6:0;branch(128+ox,128+ox,a,rnd(50,96),level===1?2.2:3,level)}
}
}
const tex=new THREE.CanvasTexture(c);
tex.wrapS=tex.wrapT=THREE.RepeatWrapping;
tex.colorSpace=THREE.SRGBColorSpace;
tex.anisotropy=4;
return tex;
}

function buildIco(sub){
const tt=(1+Math.sqrt(5))/2;
let v=[[-1,tt,0],[1,tt,0],[-1,-tt,0],[1,-tt,0],[0,-1,tt],[0,1,tt],[0,-1,-tt],[0,1,-tt],[tt,0,-1],[tt,0,1],[-tt,0,-1],[-tt,0,1]];
const V=[];
for(let i=0;i<v.length;i++){const l=Math.hypot(v[i][0],v[i][1],v[i][2]);V.push(v[i][0]/l,v[i][1]/l,v[i][2]/l)}
let F=[0,11,5,0,5,1,0,1,7,0,7,10,0,10,11,1,5,9,5,11,4,11,10,2,10,7,6,7,1,8,3,9,4,3,4,2,3,2,6,3,6,8,3,8,9,4,9,5,2,4,11,6,2,10,8,6,7,9,8,1];
for(let s=0;s<sub;s++){
const cache=new Map();
const mid=(a,b)=>{const k=a<b?a*65536+b:b*65536+a;let m=cache.get(k);if(m!==undefined)return m;const x=V[a*3]+V[b*3],y=V[a*3+1]+V[b*3+1],z=V[a*3+2]+V[b*3+2];const l=Math.hypot(x,y,z);m=V.length/3;V.push(x/l,y/l,z/l);cache.set(k,m);return m};
const NF=[];
for(let i=0;i<F.length;i+=3){const a=F[i],b=F[i+1],c=F[i+2];const ab=mid(a,b),bc=mid(b,c),ca=mid(c,a);NF.push(a,ab,ca,b,bc,ab,c,ca,bc,ab,bc,ca)}
F=NF;
}
return{V:new Float32Array(V),F:new Int32Array(F)};
}

const geoCache=new Map();

geoCache.delete(k);break;
}
}
return c;
}

function buildCache(L,N,sub,seed){
const ico=buildIco(sub);
const V=ico.V,F=ico.F,nf=F.length/3;
const rng=mulberry32(seed*7919+13);
const seeds=[],warps=[],phase=[];
const gold=Math.PI*(3-Math.sqrt(5));
for(let i=0;i<N;i++){
const y=1-(i+0.5)/N*2,r=Math.sqrt(1-y*y),th=gold*i+rng()*0.5;
seeds.push(Math.cos(th)*r,y,Math.sin(th)*r);
warps.push((rng()-0.5)*14,(rng()-0.5)*14,(rng()-0.5)*14);
phase.push(rng()*TAU);
}
const fcell=new Int32Array(nf);
const fcen=new Float32Array(nf*3);
for(let f=0;f<nf;f++){
const a=F[f*3]*3,b=F[f*3+1]*3,c=F[f*3+2]*3;
let x=V[a]+V[b]+V[c],y=V[a+1]+V[b+1]+V[c+1],z=V[a+2]+V[b+2]+V[c+2];
const l=Math.hypot(x,y,z);x/=l;y/=l;z/=l;
fcen[f*3]=x;fcen[f*3+1]=y;fcen[f*3+2]=z;
let best=-9,bi=0;
for(let i=0;i<N;i++){
const sc=x*seeds[i*3]+y*seeds[i*3+1]+z*seeds[i*3+2]+0.07*Math.sin((x*warps[i*3]+y*warps[i*3+1]+z*warps[i*3+2])+phase[i]);
if(sc>best){best=sc;bi=i}
}
fcell[f]=bi;
}
const nbFace=new Int32Array(nf*3).fill(-1);
const emap=new Map();
for(let f=0;f<nf;f++){
for(let e=0;e<3;e++){
const a=F[f*3+e],b=F[f*3+(e+1)%3];
const k=a<b?a*65536+b:b*65536+a;
const o=emap.get(k);
if(o===undefined)emap.set(k,f*3+e);
else{nbFace[f*3+e]=(o/3)|0;nbFace[o]=f}
}
}
const facesOf=[];
for(let i=0;i<N;i++)facesOf.push([]);
const nbSet=[];
for(let i=0;i<N;i++)nbSet.push(new Set());
for(let f=0;f<nf;f++){
facesOf[fcell[f]].push(f);
for(let e=0;e<3;e++){const o=nbFace[f*3+e];if(o>=0&&fcell[o]!==fcell[f])nbSet[fcell[f]].add(fcell[o])}
}
const thick=(1-CONFIG.ball.core)/L;
const dirs=[],geoms=[],centers=[],rads=[],nb=[];
for(let l=0;l<L;l++){geoms.push([]);centers.push([]);rads.push([])}
const chunkDiam=2*Math.sqrt(4/N);
const sc=1/(chunkDiam*1.5);
for(let c=0;c<N;c++){
const fl=facesOf[c];
if(!fl.length){dirs.push(null);nb.push([]);for(let l=0;l<L;l++){geoms[l].push(null);centers[l].push(null);rads[l].push(0)}continue}
let dx=0,dy=0,dz=0;
for(let i=0;i<fl.length;i++){dx+=fcen[fl[i]*3];dy+=fcen[fl[i]*3+1];dz+=fcen[fl[i]*3+2]}
const dl=Math.hypot(dx,dy,dz);dx/=dl;dy/=dl;dz/=dl;
dirs.push(new THREE.Vector3(dx,dy,dz));
nb.push(Array.from(nbSet[c]));
let rx=0,ry=1,rz=0;if(Math.abs(dy)>0.9){rx=1;ry=0}
let ux=ry*dz-rz*dy,uy=rz*dx-rx*dz,uz=rx*dy-ry*dx;
const ul=Math.hypot(ux,uy,uz);ux/=ul;uy/=ul;uz/=ul;
const vx=dy*uz-dz*uy,vy=dz*ux-dx*uz,vz=dx*uy-dy*ux;
const jx=(rng()-0.5)*0.16,jy=(rng()-0.5)*0.16;
for(let l=0;l<L;l++){
const r1=1-l*thick,r0=r1-thick,cr=(r0+r1)/2;
const cx=dx*cr,cy=dy*cr,cz=dz*cr;
const P=[],Nn=[],U=[];
const vert=(x,y,z,nx,ny,nz)=>{P.push(x-cx,y-cy,z-cz);Nn.push(nx,ny,nz);U.push(0.5+jx+(x*ux+y*uy+z*uz)*sc,0.5+jy+(x*vx+y*vy+z*vz)*sc)};
for(let i=0;i<fl.length;i++){
const f=fl[i];
const ia=F[f*3]*3,ib=F[f*3+1]*3,ic=F[f*3+2]*3;
const ax=V[ia],ay=V[ia+1],az=V[ia+2],bx=V[ib],by=V[ib+1],bz=V[ib+2],qx=V[ic],qy=V[ic+1],qz=V[ic+2];
vert(ax*r1,ay*r1,az*r1,ax,ay,az);vert(bx*r1,by*r1,bz*r1,bx,by,bz);vert(qx*r1,qy*r1,qz*r1,qx,qy,qz);
vert(ax*r0,ay*r0,az*r0,-ax,-ay,-az);vert(qx*r0,qy*r0,qz*r0,-qx,-qy,-qz);vert(bx*r0,by*r0,bz*r0,-bx,-by,-bz);
for(let e=0;e<3;e++){
const o=nbFace[f*3+e];
if(o>=0&&fcell[o]===c)continue;
const ip=F[f*3+e]*3,iq=F[f*3+(e+1)%3]*3;
const px=V[ip],py=V[ip+1],pz=V[ip+2],qx2=V[iq],qy2=V[iq+1],qz2=V[iq+2];
const p1x=px*r1,p1y=py*r1,p1z=pz*r1,q1x=qx2*r1,q1y=qy2*r1,q1z=qz2*r1,p0x=px*r0,p0y=py*r0,p0z=pz*r0,q0x=qx2*r0,q0y=qy2*r0,q0z=qz2*r0;
const e1x=p0x-p1x,e1y=p0y-p1y,e1z=p0z-p1z,e2x=q0x-p1x,e2y=q0y-p1y,e2z=q0z-p1z;
let nx=e1y*e2z-e1z*e2y,ny=e1z*e2x-e1x*e2z,nz=e1x*e2y-e1y*e2x;
const nl=Math.hypot(nx,ny,nz)||1;nx/=nl;ny/=nl;nz/=nl;
vert(p1x,p1y,p1z,nx,ny,nz);vert(p0x,p0y,p0z,nx,ny,nz);vert(q0x,q0y,q0z,nx,ny,nz);
vert(p1x,p1y,p1z,nx,ny,nz);vert(q0x,q0y,q0z,nx,ny,nz);vert(q1x,q1y,q1z,nx,ny,nz);
}
}
const g=new THREE.BufferGeometry();
g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(P),3));
g.setAttribute('normal',new THREE.BufferAttribute(new Float32Array(Nn),3));
g.setAttribute('uv',new THREE.BufferAttribute(new Float32Array(U),2));
g.computeBoundingSphere();
geoms[l].push(g);
centers[l].push(new THREE.Vector3(cx,cy,cz));
rads[l].push(g.boundingSphere.radius);
}
}
return{L,N,geoms,centers,rads,nb,dirs};
}

let shakeT=0;
function updateCamera(rdt){
shakeT+=rdt;
trauma=Math.max(0,trauma-rdt*2.4);
const sh=trauma*trauma*(S.shake/100)*CONFIG.camera.shake*ball.R;
const idle=0.012*(S.shake/100);
const nx=(Math.sin(shakeT*41)+Math.sin(shakeT*27.3))*sh+Math.sin(shakeT*0.7)*idle;
const ny=(Math.sin(shakeT*37.7)+Math.cos(shakeT*23.1))*sh+Math.cos(shakeT*0.9)*idle;
const portrait=camH>camW;
camPitchCur=lerp(camPitchCur,camPitchT,Math.min(1,rdt*5));camDistCur=lerp(camDistCur,camDistT,Math.min(1,rdt*5));
const dist=fitDist*lerp(1,CONFIG.reveal.zoom,camBlend)*camDistCur;
const p=camPitchCur;
const cy=ball.R*(portrait?0.62:0.9);
lookT.set(0,lerp(cy,ball.R,camBlend),0);
camera.position.set(lookT.x+nx,lookT.y+Math.sin(p)*dist+ny,lookT.z+Math.cos(p)*dist);
camera.lookAt(lookT);
const fov=CONFIG.camera.fov-fovPunch*6;
if(Math.abs(camera.fov-fov)>0.01){camera.fov=fov;camera.updateProjectionMatrix()}
}

function updatePhase(rdt,gdt){
if(phase==='slow'){
phaseT+=rdt;
fovPunch=lerp(fovPunch,1,Math.min(1,rdt*5));
if(phaseT>=(round.mode==='rush'?RUSH.slow:CONFIG.slowmo.time)){phase='reveal';phaseT=0;bus.emit('reveal')}
}else if(phase==='reveal'){
phaseT+=rdt;
fovPunch=lerp(fovPunch,0,Math.min(1,rdt*5));
camBlend=ease(clamp(phaseT/0.9,0,1));
const rvR=round.mode==='rush'?RUSH.rotate:CONFIG.reveal.rotate,k=clamp(phaseT/rvR,0,1);
const pop=ease(clamp(phaseT/0.6,0,1));
itemGroup.scale.setScalar(ball.R*lerp(0.28,0.52,pop));
itemGroup.rotation.y=ease(k)*TAU+phaseT*0.4;
itemGroup.position.y=ball.R+Math.sin(phaseT*2)*0.04*ball.R;
if(phaseT>=rvR){phase='done';phaseT=0;$('btnNext').classList.add('on');bus.emit('done')}
}else if(phase==='done'){
phaseT+=rdt;
itemGroup.rotation.y+=rdt*0.5;
itemGroup.position.y=ball.R+Math.sin((phaseT+(round.mode==='rush'?RUSH.rotate:CONFIG.reveal.rotate))*2)*0.04*ball.R;
if(phaseT>=(round.mode==='rush'?RUSH.auto:CONFIG.reveal.auto))nextBall();
}
}

function updateKicks(dt){
for(let i=kicks.length-1;i>=0;i--){
const c=kicks[i];
c.kick-=dt*7;
if(c.kick<=0){c.kick=0;c.mesh.scale.set(1,1,1);kicks[i]=kicks[kicks.length-1];kicks.pop();continue}
c.mesh.scale.setScalar(1+c.kick*0.06);
}
ball.squash=Math.max(0,ball.squash-dt*6);
}

function simulate(rdt){
timeCtl.slowT=Math.max(0,timeCtl.slowT-rdt);
const target=timeCtl.slowT>0?CONFIG.slowmo.scale:(timeCtl.photoSlow?0.3:1);
timeCtl.scale=lerp(timeCtl.scale,target,Math.min(1,rdt*10));
const gdt=rdt*timeCtl.scale;
T+=gdt;
kbAxes();
const jx=(joyX+kbX)*(S.joyInvert?-1:1),jy=joyY+kbY;
const rs=2.4*(S.sens/100)*rdt;
ball.yaw+=clamp(jx,-1,1)*rs;
ball.pitch=clamp(ball.pitch+clamp(jy,-1,1)*rs*0.7,-1.1,1.1);
if(phase==='break'&&state==='play'&&!frozen){
if(ball.attached.length===0&&ball.left!==0){ball.left=0;onBallCleared()}
drillTick(gdt);
comboUpdate(gdt);
if(T-lastProgress>20&&ball.attached.length){
lastProgress=T;
autoAssist();
}
idleT+=rdt;
}
updatePhase(rdt,gdt);
acc+=gdt;
let n=0;
while(acc>=CONFIG.step&&n<CONFIG.maxSteps){acc-=CONFIG.step;n++;stepPieces(CONFIG.step);stepDebris(CONFIG.step)}
if(n>=CONFIG.maxSteps)acc=0;
updateKicks(gdt);
ball.group.rotation.set(ball.pitch,ball.yaw,0);
const sq=ball.squash*0.045;
ball.group.scale.set(ball.R*(1+sq),ball.R*(1-sq*1.4),ball.R*(1+sq));
}

for(let i=0;i<ball.attached.length;i++){const ch=ball.attached[i].userData.ch;if(ch&&ch.layer<bl){bl=ch.layer;best=ch}}
if(!best)return;
tmpV.copy(best.mesh.position);
detach(best,tmpV,CONFIG.tools.hand,'hand',false);
say('idle');
}
